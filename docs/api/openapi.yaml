        applicationCount: { type: integer, minimum: 0 }
        applicationId:
          oneOf:
            - { type: string }
            - { type: 'null' }
        vendor:
          oneOf:
            - { type: string }
            - { type: 'null' }
        appKeyConfigured: { type: boolean }
        tcSecretAppIdConfigured: { type: boolean }
        tcSecretIdConfigured: { type: boolean }
        tcSecretKeyConfigured: { type: boolean }
        source: { type: string }
    RotateChannelCredentialRequest:
      type: object
      required: [credential]
      properties:
        credential: { $ref: '#/components/schemas/ChannelCredentialValue' }
    CreateEnterpriseRequest:
