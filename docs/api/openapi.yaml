        customerCode: { type: string, minLength: 1, maxLength: 128 }
        unifiedSocialCreditCode: { type: string, minLength: 18, maxLength: 18 }
        contactPerson: { type: string, maxLength: 128, nullable: true }
        contactPhone: { type: string, maxLength: 32, nullable: true }
        adpAppId: { type: string, nullable: true }
    UpdateEnterpriseRequest:
