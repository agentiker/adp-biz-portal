    ChannelCredential:
      type: object
      required: [id, channel, channelInstanceId, credentialMask, version, keyVersion, fingerprint, status, createdAt, updatedAt, rotatedAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        enterpriseId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        enterpriseName: { type: string }
        customerCode: { type: string }
        connectionId:
          oneOf:
            - { type: string, format: uuid }
            - { type: 'null' }
        applicationId: { type: string }
        vendor: { type: string }
        channel: { type: string, maxLength: 48 }
        channelInstanceId: { type: string, maxLength: 128 }
        credentialMask: { type: string, const: '********' }
        version: { type: integer, minimum: 1 }
        keyVersion: { type: string, maxLength: 64 }
        fingerprint: { type: string, minLength: 64, maxLength: 64 }
        status: { type: string, enum: [active, disabled] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        rotatedAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
        expiresAt:
          oneOf:
            - { type: string, format: date-time }
            - { type: 'null' }
    ChannelCredentialValue:
      oneOf:
        - { type: string, minLength: 1, maxLength: 65536 }
        - { type: object, additionalProperties: true }
        - { type: array, items: {} }
      description: Secret value accepted by the server; never present in responses.
    CreateChannelCredentialRequest:
      type: object
      required: [channel, channelInstanceId, credential]
      properties:
        channel: { type: string, minLength: 1, maxLength: 48 }
        channelInstanceId: { type: string, minLength: 1, maxLength: 128 }
        credential: { $ref: '#/components/schemas/ChannelCredentialValue' }
