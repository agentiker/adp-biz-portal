name: adp-business-gateway

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PGSQL_DB:?PGSQL_DB is required}
      POSTGRES_USER: ${PGSQL_USER:?PGSQL_USER is required}
      POSTGRES_PASSWORD: ${PGSQL_PASSWORD:?PGSQL_PASSWORD is required}
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  migrate:
    image: ${APP_IMAGE:-adp-business-gateway:local}
    restart: "no"
    env_file:
      - ${COMPOSE_ENV_FILE:-./.env}
    environment:
      PGSQL_HOST: postgres
      PGSQL_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "migrate.py", "upgrade", "--applied-by", "compose-migration"]

  api:
    image: ${APP_IMAGE:-adp-business-gateway:local}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-./.env}
    environment:
      PGSQL_HOST: postgres
      PGSQL_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  worker:
    image: ${APP_IMAGE:-adp-business-gateway:local}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-./.env}
    environment:
      PGSQL_HOST: postgres
      PGSQL_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "worker.py", "--idle-seconds", "1"]

  wecom-ws-gateway:
    image: ${APP_IMAGE:-adp-business-gateway:local}
    restart: unless-stopped
    env_file:
      - ${COMPOSE_ENV_FILE:-./.env}
    environment:
      PGSQL_HOST: postgres
      PGSQL_PORT: 5432
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Holds an outbound WebSocket per configured wecom_bot instance and streams
    # replies inline; no inbound port. Idle no-op when no bot is configured.
    command: ["python", "wecom_ws_gateway.py"]

  reverse-proxy:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${SERVER_HTTP_PORT:-8000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  platform-postgres:
    # Pin the underlying Docker volume to its original project-prefixed name so
    # renaming the compose project from adp-chat-client to adp-business-gateway
    # keeps the existing production data in place (no data move). See
    # docs/operations/release-and-rollback.md for the live cutover steps.
    name: adp-chat-client_platform-postgres
